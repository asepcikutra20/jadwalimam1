<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Sistem TV Masjid</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Arial Black', Arial, sans-serif; text-align: center; padding: 20px; overflow: hidden; }
        
        /* LAYOUT TV */
        #layar-tv { display: block; }
        h1 { font-size: 85px; color: #00ff88; margin-bottom: 10px; text-shadow: 0 0 15px #00ff88; }
        .tgl { font-size: 38px; color: #ccc; margin-bottom: 25px; }
        .box { background: #111; padding: 30px; margin: 20px auto; border-radius: 20px; border-left: 10px solid #00ff88; max-width: 1100px; transition: all 0.5s ease; text-align: center; }
        .box h2 { font-size: 50px; margin-bottom: 10px; }
        .box h3 { font-size: 70px; color: #00ff88; margin-bottom: 12px; }
        .box p { font-size: 32px; margin: 5px; }
        
        /* TAMPILAN JADWAL MENDEKATI WAKTU (TANPA KEDIP) */
        .soon { background: #00ff88; color: #000; box-shadow: 0 0 40px #00ff88; }
        .soon * { color: #000 !important; text-shadow: none !important; }
        
        .kosong { font-size: 50px; margin-top: 150px; color: #444; font-weight: bold; }
        
        /* TOMBOL KONTROL BAWAH */
        .btn-bawah { position: fixed; bottom: 10px; background: rgba(255,255,255,0.05); color: #333; border: 0; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; font-family: Arial; transition: all 0.3s; }
        .btn-bawah:hover { color: #fff; background: #222; }
        .btn-admin { right: 10px; }

        /* LAYOUT INPUT JADWAL (ADMIN) */
        #layar-input { display: none; background: #111; color: #fff; font-family: Arial; padding: 15px; max-width: 700px; margin: auto; text-align: left; overflow-y: auto; height: 100vh; }
        #layar-input h1 { font-size: 32px; margin-bottom: 20px; text-shadow: none; text-align: center; }
        input, select, .btn-aksi { width: 100%; padding: 14px; margin: 6px 0; border: 0; border-radius: 10px; font-size: 18px; box-sizing: border-box; }
        input, select { background: #222; color: #fff; }
        .btn-aksi { background: #00ff88; color: #000; font-weight: bold; cursor: pointer; }
        .jadwal-item { background: #000; padding: 12px; margin: 8px 0; border-left: 4px solid #00ff88; display: flex; justify-content: space-between; align-items: center; }
        .info { flex-grow: 1; }
        .info strong { font-size: 18px; color: #00ff88; }
        .info small { font-size: 14px; color: #ccc; }
        
        /* GAYA TOMBOL EDIT DAN AREA AKSI */
        .grup-tombol { display: flex; gap: 8px; }
        .btn-del { background: red; color: white; padding: 8px 12px; width: auto; font-size: 14px; margin: 0; border-radius: 5px; border: 0; cursor: pointer; }
        .btn-edit { background: #00aeff; color: white; padding: 8px 12px; width: auto; font-size: 14px; margin: 0; border-radius: 5px; border: 0; cursor: pointer; }

        /* OTOMATIS MENYESUAIKAN UKURAN LAYAR HP */
        @media (max-width: 768px) {
            body { overflow-y: auto; padding: 10px; }
            h1 { font-size: 32px; }
            .tgl { font-size: 18px; margin-bottom: 15px; }
            .box { padding: 15px; margin: 10px auto; border-left-width: 6px; }
            .box h2 { font-size: 24px; }
            .box h3 { font-size: 28px; }
            .box p { font-size: 16px; }
            .kosong { font-size: 22px; margin-top: 50px; }
        }
    </style>
</head>
<body>

    <!-- CONTAINER 1: TAMPILAN TV MASJID -->
    <div id="layar-tv">
        <h1>MASJID AL MUSLIM</h1>
        <div class="tgl" id="tgl"></div>
        <div id="isi-tv"></div>
        
        <!-- Tombol Kontrol -->
        <button class="btn-bawah btn-admin" onclick="bukaAdmin()">⚙️</button>
    </div>

    <!-- CONTAINER 2: HALAMAN INPUT JADWAL -->
    <div id="layar-input">
        <h1>EDIT JADWAL MASJID</h1>
        <select id="h">
            <option value="1">Senin</option><option value="2">Selasa</option><option value="3">Rabu</option>
            <option value="4">Kamis</option><option value="5">Jum'at</option><option value="6">Sabtu</option><option value="7">Ahad</option>
        </select>
        <input id="j" type="time">
        <input id="k" placeholder="Kegiatan">
        <input id="i" placeholder="Imam">
        <input id="b1" placeholder="Badal 1">
        <input id="b2" placeholder="Badal 2">
        
        <button class="btn-aksi" onclick="simpan()">SIMPAN JADWAL</button>
        <button class="btn-aksi" onclick="hapusSemua()" style="background:red; color:#fff;">HAPUS SEMUA DATA</button>
        <button class="btn-aksi" onclick="tutupAdmin()" style="background:#555; color:#fff; margin-top: 15px;">⬅️ KEMBALI KE TV</button>
        <hr style="margin: 20px 0; border-color: #333;">
        <div id="daftar-jadwal-input"></div>
    </div>

<script>
const namaHari = ["", "Senin", "Selasa", "Rabu", "Kamis", "Jum'at", "Sabtu", "Ahad"];

// NAVIGASI HALAMAN
function bukaAdmin() {
    document.getElementById("layar-tv").style.display = "none";
    document.getElementById("layar-input").style.display = "block";
    tampilInputan();
}
function tutupAdmin() {
    document.getElementById("layar-input").style.display = "none";
    document.getElementById("layar-tv").style.display = "block";
    jalanTV();
}

// LOGIKA HALAMAN INPUT (ASLI BAWAN ANDA - 100% AMAN & NORMAL)
function simpan() {
    if (!j.value || !k.value) { alert("Waktu dan Kegiatan harus diisi!"); return; }
    let x = JSON.parse(localStorage.jadwal || "[]");
    x.push({ h: parseInt(h.value), j: j.value, k: k.value, i: i.value || "-", b1: b1.value || "-", b2: b2.value || "-" });
    x.sort((a, b) => a.h - b.h || a.j.localeCompare(b.j));
    localStorage.jadwal = JSON.stringify(x);
    alert("Tersimpan");
    k.value = ""; i.value = ""; b1.value = ""; b2.value = "";
    tampilInputan();
}

// METODE SIMPLE & PASTI BERHASIL: Naikkan data lama lalu panggil fungsi hapus bawaan Anda
function panggilDataEdit(index) {
    let x = JSON.parse(localStorage.jadwal || "[]");
    let target = x[index];
    
    // 1. Naikkan teks data lama ke kotak input atas
    document.getElementById("h").value = target.h;
    document.getElementById("j").value = target.j;
    document.getElementById("k").value = target.k;
    document.getElementById("i").value = target.i === "-" ? "" : target.i;
    document.getElementById("b1").value = target.b1 === "-" ? "" : target.b1;
    document.getElementById("b2").value = target.b2 === "-" ? "" : target.b2;
    
    // 2. Langsung hapus data lama tersebut dari daftar bawah
    x.splice(index, 1);
    localStorage.jadwal = JSON.stringify(x);
    tampilInputan();
    
    // 3. Geser layar ke atas agar form input langsung kelihatan di HP
    document.getElementById("layar-input").scrollTop = 0;
}

// MENAMPILKAN DATA DI HALAMAN INPUT
function tampilInputan() {
    let x = JSON.parse(localStorage.jadwal || "[]");
    document.getElementById("daftar-jadwal-input").innerHTML = x.map((v, index) => `
        <div class="jadwal-item">
            <div class="info">
                <strong>[${namaHari[v.h]} - ${v.j}]</strong> ${v.k}<br>
                <small>Imam: ${v.i} | Badal: ${v.b1} / ${v.b2}</small>
            </div>
            <div class="grup-tombol">
                <button class="btn-edit" onclick="panggilDataEdit(${index})">📝</button>
                <button class="btn-del" onclick="del(${index})">X</button>
            </div>
        </div>
    `).join("") || "<p style='color:#666;text-align:center;'>Belum ada jadwal disimpan.</p>";
}

function del(index) {
    if (confirm("Hapus jadwal ini?")) {
        let x = JSON.parse(localStorage.jadwal || "[]");
        x.splice(index, 1);
        localStorage.jadwal = JSON.stringify(x);
        tampilInputan();
    }
}

function hapusSemua() {
    if (confirm("Hapus seluruh data jadwal?")) { localStorage.removeItem("jadwal"); tampilInputan(); }
}

// LOGIKA HALAMAN TAYANG TV (ASLI JALAN 100%)
function jalanTV() {
    let now = new Date();
    let jsDay = now.getDay();
    let angkaHariIni = (jsDay === 0) ? 7 : jsDay;
    
    let opsiTgl = { day: '2-digit', month: 'long', year: 'numeric' };
    let teksWaktu = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById("tgl").innerText = `${namaHari[angkaHariIni]}, ${now.toLocaleDateString('id-ID', opsiTgl)} | ${teksWaktu}`;
    
    let data = JSON.parse(localStorage.jadwal || "[]");
    let html = "";
    let jadwalHariIni = data.filter(d => parseInt(d.h) === angkaHariIni);
    
    jadwalHariIni.forEach(d => {
        let [ja, me] = d.j.split(":");
        let waktuTarget = new Date();
        waktuTarget.setHours(parseInt(ja), parseInt(me), 0, 0);
        
        let waktuMulaiTampil = new Date(waktuTarget.getTime() - 15 * 60000);
        let waktuSelesai = new Date(waktuTarget.getTime() + 30 * 60000);
        
        if (now >= waktuMulaiTampil && now < waktuSelesai) {
            let cls = (now >= waktuMulaiTampil && now < waktuTarget) ? "soon" : "";
            html += `
                <div class="box ${cls}">
                    <h2>${d.k}</h2>
                    <h3>Pukul ${d.j} WIB</h3>
                    <p>Imam: ${d.i}</p>
                    <p>Badal: ${d.b1} / ${d.b2}</p>
                </div>
            `;
        }
    });
    
    document.getElementById("isi-tv").innerHTML = html || "<div class='kosong'>TULUSKAN NIAT, TEGAKKAN SHOLAT</div>";
}

// Jalankan otomatis setiap detik
setInterval(jalanTV, 1000);
jalanTV();
</script>
</body>
</html>
